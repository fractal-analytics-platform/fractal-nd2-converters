[default.extend-identifiers]
# Don't correct these identifiers (matched as whole tokens)
FOV = "FOV"
FOVs = "FOVs"
FoV = "FoV"
PNGs = "PNGs"

[default.extend-words]
# Don't correct the spelling of these words
OME = "OME"
caf = "caf"
nd = "nd"
lamda = "lamda"  # literal ND2 vendor filename token (z-lamda) in test fixtures
